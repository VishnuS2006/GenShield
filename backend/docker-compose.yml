services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genshield
      POSTGRES_USER: genshield
      POSTGRES_PASSWORD: genshield_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genshield -d genshield"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
